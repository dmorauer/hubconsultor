name: Test and build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ValidadorPaytrack --add-data "templates;templates" --add-data "schema.json;." --add-data "assets;assets" --icon "assets/paytrack.ico" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValidadorPaytrack-Windows
          path: dist/ValidadorPaytrack.exe
          if-no-files-found: error
